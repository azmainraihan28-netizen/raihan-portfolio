<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e0f"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="tb-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d1a"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <filter id="tb-shadow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#tb-bg)"/>
  <!-- Faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0 125 H800 M0 250 H800 M0 375 H800 M200 0 V500 M400 0 V500 M600 0 V500"/>
  </g>
  <!-- Big orange banner -->
  <rect x="70" y="90" width="510" height="240" rx="6" fill="url(#tb-orange)"/>
  <!-- Headline -->
  <text x="325" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="42" fill="#fff" letter-spacing="-1">DON'T MISS THE</text>
  <text x="325" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="42" fill="#fff" letter-spacing="-1">NEXT VIRAL DROP.</text>
  <!-- Fake input -->
  <rect x="130" y="260" width="230" height="34" rx="17" fill="#fff"/>
  <text x="150" y="282" font-family="Inter, sans-serif" font-size="12" fill="#8b8b90">Enter your email</text>
  <rect x="370" y="260" width="130" height="34" rx="17" fill="#0e8f5a"/>
  <text x="435" y="282" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="#fff">JOIN NOW</text>
  <!-- Small product tile bottom-right -->
  <rect x="610" y="90" width="145" height="240" rx="8" fill="#111" stroke="#242427"/>
  <rect x="625" y="105" width="115" height="105" rx="4" fill="#2a1a3a"/>
  <text x="682" y="163" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#ff4d1a" letter-spacing="1">LIFESTYLE</text>
  <text x="625" y="238" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#fff">VIRAL</text>
  <text x="625" y="254" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#fff">BLENDER PRO</text>
  <text x="625" y="278" font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#ff4d1a">BDT 2,450</text>
  <rect x="625" y="292" width="115" height="25" rx="3" fill="#111" stroke="#333"/>
  <text x="682" y="309" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="10" fill="#fff">ADD TO CART</text>
  <!-- Footer -->
  <rect x="70" y="350" width="685" height="80" rx="4" fill="#111" stroke="#242427"/>
  <text x="90" y="378" font-family="Inter, sans-serif" font-weight="900" font-size="18" fill="#ff4d1a">TRENDY</text>
  <text x="163" y="378" font-family="Inter, sans-serif" font-weight="900" font-size="18" fill="#fff">BD</text>
  <text x="90" y="400" font-family="Inter, sans-serif" font-size="10" fill="#8b8b90">Premium China imports for the trendy Bangladeshi generation.</text>
  <text x="480" y="378" font-family="Inter, sans-serif" font-size="10" fill="#ff4d1a" letter-spacing="1.5">SHOP</text>
  <text x="480" y="395" font-family="Inter, sans-serif" font-size="10" fill="#fff">TRENDING NOW</text>
  <text x="480" y="410" font-family="Inter, sans-serif" font-size="10" fill="#8b8b90">NEW ARRIVALS</text>
  <text x="580" y="378" font-family="Inter, sans-serif" font-size="10" fill="#ff4d1a" letter-spacing="1.5">CONTACT</text>
  <text x="580" y="395" font-family="Inter, sans-serif" font-size="10" fill="#fff">+880 1234 567890</text>
  <text x="580" y="410" font-family="Inter, sans-serif" font-size="10" fill="#8b8b90">support@trendybd.com</text>
