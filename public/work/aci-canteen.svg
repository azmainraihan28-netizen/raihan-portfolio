<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ac-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#0d1a30"/>
    </linearGradient>
    <linearGradient id="ac-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ac-bg)"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="500" fill="#0a1220"/>
  <text x="24" y="45" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="2">ACI CANTEEN</text>
  <text x="24" y="60" font-family="Inter, sans-serif" font-size="9" fill="#5a7599">◇ Admin Access</text>
  <rect x="14" y="88" width="152" height="34" rx="6" fill="#1e3a8a" opacity="0.4"/>
  <text x="32" y="109" font-family="Inter, sans-serif" font-weight="600" font-size="11" fill="#93c5fd">◈ Executive Dashboard</text>
  <g font-family="Inter, sans-serif" font-size="11" fill="#7a90b0">
    <text x="32" y="145">◇ Events Report</text>
    <text x="32" y="173">◇ Analytics &amp; Reporting</text>
    <text x="32" y="201">◇ Daily Entry</text>
    <text x="32" y="229">◇ Masters &amp; Stock</text>
    <text x="32" y="257">◇ Supplier-Wise Ingred</text>
    <text x="32" y="285">◇ Activity Logs</text>
  </g>
  <line x1="14" y1="365" x2="166" y2="365" stroke="#1a2a44"/>
  <text x="32" y="390" font-family="Inter, sans-serif" font-size="10" fill="#22c55e">● Cloud Connected</text>
  <text x="32" y="410" font-family="Inter, sans-serif" font-size="10" fill="#7a90b0">☀ Light Mode</text>
  <text x="32" y="430" font-family="Inter, sans-serif" font-size="10" fill="#7a90b0">⚙ System Settings</text>
  <text x="32" y="450" font-family="Inter, sans-serif" font-size="10" fill="#7a90b0">→ Logout</text>
  <text x="32" y="485" font-family="Inter, sans-serif" font-size="8" fill="#4a5a70" letter-spacing="1.5">POWERED BY SUPABASE</text>
  <!-- Main -->
  <text x="205" y="45" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#fff">Executive Dashboard</text>
  <text x="205" y="65" font-family="Inter, sans-serif" font-size="11" fill="#8ba0c0">Overview for Last 30 Days</text>
  <rect x="360" y="52" width="115" height="16" rx="3" fill="#0e1e35"/>
  <circle cx="372" cy="60" r="3" fill="#22c55e"/>
  <text x="380" y="63" font-family="Inter, sans-serif" font-size="9" fill="#22c55e" letter-spacing="1">LIVE SUPABASE SYNC</text>
  <!-- KPI cards -->
  <g font-family="Inter, sans-serif">
    <rect x="205" y="88" width="150" height="88" rx="8" fill="#0e1e35" stroke="#1e3153"/>
    <text x="220" y="112" font-size="10" fill="#8ba0c0">Average Daily Cost</text>
    <text x="220" y="152" font-weight="700" font-size="22" fill="#fff">৳178,460</text>

    <rect x="365" y="88" width="150" height="88" rx="8" fill="#0e1e35" stroke="#1e3153"/>
    <text x="380" y="112" font-size="10" fill="#8ba0c0">Average Per Head Cost</text>
    <text x="380" y="152" font-weight="700" font-size="22" fill="#ef4444">৳74.61</text>
    <text x="380" y="168" font-size="9" fill="#ef4444">Exceeds Target by ৳1.89</text>

    <rect x="525" y="88" width="130" height="88" rx="8" fill="#0e1e35" stroke="#1e3153"/>
    <text x="540" y="112" font-size="10" fill="#8ba0c0">Average Participants</text>
    <text x="540" y="152" font-weight="700" font-size="22" fill="#fff">2,392</text>

    <rect x="665" y="88" width="120" height="88" rx="8" fill="#0e1e35" stroke="#1e3153"/>
    <text x="680" y="112" font-size="10" fill="#8ba0c0">Stock Alerts</text>
    <text x="680" y="152" font-weight="700" font-size="22" fill="#fff">45</text>
    <rect x="740" y="100" width="42" height="14" rx="3" fill="#ef4444" opacity="0.2"/>
    <text x="761" y="110" text-anchor="middle" font-size="8" fill="#ef4444">Action Needed</text>
  </g>
  <!-- Chart -->
