  <text x="225" y="220" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#fff">Cost Per Head Analysis</text>
  <text x="225" y="238" font-family="Inter, sans-serif" font-size="10" fill="#8ba0c0">30-day performance trend</text>
  <g>
    <rect x="230" y="380" width="12" height="35" fill="url(#ac-bar)"/>
    <rect x="248" y="360" width="12" height="55" fill="url(#ac-bar)"/>
    <rect x="266" y="330" width="12" height="85" fill="url(#ac-bar)"/>
    <rect x="284" y="290" width="12" height="125" fill="url(#ac-bar)"/>
    <rect x="302" y="310" width="12" height="105" fill="url(#ac-bar)"/>
    <rect x="320" y="340" width="12" height="75" fill="url(#ac-bar)"/>
    <rect x="338" y="285" width="12" height="130" fill="url(#ac-bar)"/>
    <rect x="356" y="270" width="12" height="145" fill="url(#ac-bar)"/>
    <rect x="374" y="300" width="12" height="115" fill="url(#ac-bar)"/>
    <rect x="392" y="320" width="12" height="95" fill="url(#ac-bar)"/>
    <rect x="410" y="290" width="12" height="125" fill="url(#ac-bar)"/>
    <rect x="428" y="345" width="12" height="70" fill="url(#ac-bar)"/>
    <rect x="446" y="315" width="12" height="100" fill="url(#ac-bar)"/>
    <rect x="464" y="360" width="12" height="55" fill="url(#ac-bar)"/>
    <rect x="482" y="330" width="12" height="85" fill="url(#ac-bar)"/>
    <rect x="500" y="295" width="12" height="120" fill="url(#ac-bar)"/>
    <rect x="518" y="325" width="12" height="90" fill="url(#ac-bar)"/>
    <rect x="536" y="355" width="12" height="60" fill="url(#ac-bar)"/>
  </g>
  <!-- Right stock card -->
  <rect x="575" y="195" width="210" height="230" rx="8" fill="#0e1e35" stroke="#1e3153"/>
  <text x="590" y="220" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#fff">Low Stock Warnings</text>
  <text x="775" y="220" text-anchor="end" font-family="Inter, sans-serif" font-size="10" fill="#8ba0c0">45 items</text>
  <line x1="590" y1="235" x2="775" y2="235" stroke="#1e3153"/>
  <g font-family="Inter, sans-serif">
    <text x="590" y="258" font-weight="600" font-size="11" fill="#fff">Aerometic</text>
    <text x="590" y="272" font-size="9" fill="#8ba0c0">Min: 50 kg</text>
    <text x="775" y="265" text-anchor="end" font-weight="700" font-size="14" fill="#22c55e">50 kg</text>
    <rect x="590" y="282" width="185" height="2" rx="1" fill="#ef4444" opacity="0.5"/>

    <text x="590" y="308" font-weight="600" font-size="11" fill="#fff">Almonds</text>
    <text x="590" y="322" font-size="9" fill="#8ba0c0">Min: 1 kg</text>
    <text x="775" y="315" text-anchor="end" font-weight="700" font-size="14" fill="#ef4444">0 kg</text>

    <text x="590" y="358" font-weight="600" font-size="11" fill="#fff">Alu Bokhara</text>
    <text x="590" y="372" font-size="9" fill="#8ba0c0">Min: 1 kg</text>
    <text x="775" y="365" text-anchor="end" font-weight="700" font-size="14" fill="#ef4444">0 kg</text>
  </g>
</svg>
